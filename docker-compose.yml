version: '3.3'

services:

  srv:
    image: ${DOCKER_REGISTRY_URL}/onec-server:${ONEC_VERSION}
    hostname: srv
    ports:
      - "1540-1541:1540-1541"
      - "1560:1560"
    volumes:
      - srv_data:/home/usr1cv8/.1cv8
      - srv_log:/var/log/1C
    networks:
      - back_net

  postgres:
    # Используется Postgres Pro 16 с поддержкой 1С:Предприятие
    # Включает расширения: mchar, fulleq, fasttrun
    image: ${DOCKER_REGISTRY_URL}/onec-postgres-pro:16
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: onec-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
      POSTGRES_INITDB_ARGS: "--locale=ru_RU.UTF-8 --encoding=UTF8"
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD:-scram-sha-256}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d
    networks:
      back_net:
        aliases:
          - db
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: onec-pgadmin
    hostname: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_strong_password}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./postgres/pgadmin-servers.json:/pgadmin4/servers.json
    networks:
      - back_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  repo:
    image: ${DOCKER_REGISTRY_URL}/onec-crs:${ONEC_VERSION}
    ports:
      - "${CRS_PORT}:1542"
    volumes:
      - repo_data:/home/usr1cv8/.1cv8
    networks:
      - back_net

  ras:
    image: ${DOCKER_REGISTRY_URL}/onec-server:${ONEC_VERSION}
    entrypoint: /opt/1cv8/current/ras
    command: "cluster srv:1540"
    ports:
      - "${RAS_PORT}:1545"
    networks:
      - back_net

  client:
    image: ${DOCKER_REGISTRY_URL}/onec-client-vnc:${ONEC_VERSION}
    ports:
      - "5900:5900"
    volumes:
      - client_data:/home/usr1cv8/.1cv8
      - ${PWD}/nethasp.ini:/opt/1cv8/current/conf/nethasp.ini
    networks:
      - back_net

volumes:
  srv_data: {}
  srv_log: {}
  postgres_data: {}
  pgadmin_data: {}
  repo_data: {}
  client_data: {}

networks:
  back_net: {}
